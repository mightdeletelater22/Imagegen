<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receipt Generator</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- html2canvas for generating the image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #92c13e;
            --text-dark: #111111;
            --text-gray: #8c8c8c;
            --divider-color: #e8e8e8;
            --bg-color: #ffffff;
            --font-main: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-main);
            background-color: #e0e0e0; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .phone-screen {
            width: 100%;
            max-width: 480px; 
            background-color: var(--bg-color);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Form Styles */
        #form-screen { padding: 24px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; min-height: 100dvh; }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h1 { font-size: 24px; color: var(--text-dark); margin-bottom: 8px; }
        .form-header p { color: var(--text-gray); font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-dark); margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #ccc; border-radius: 12px; font-size: 16px; font-family: var(--font-main); outline: none; -webkit-appearance: none; }
        .form-group input:focus { border-color: var(--primary-green); }
        .submit-btn { width: 100%; padding: 16px; background-color: var(--primary-green); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; -webkit-appearance: none; }
        
        /* Receipt Styles */
        #receipt-screen { display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh; background-color: var(--bg-color); }
        
        /* Action Bar (Download/Share) */
        .action-bar { display: flex; justify-content: space-between; padding: 20px; color: var(--primary-green); font-size: 18px; font-weight: 400; background-color: white; }
        .action-btn { display: flex; align-items: center; gap: 8px; }
        .action-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--primary-green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; padding-top: 10px; }
        
        .success-header { display: flex; flex-direction: column; align-items: center; margin-top: 10px; margin-bottom: 40px; }
        .check-circle { width: 90px; height: 90px; background-color: var(--primary-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .check-circle svg { width: 45px; height: 45px; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .success-title { color: var(--primary-green); font-size: 24px; font-weight: 400; letter-spacing: 0.5px; }
        
        .amount-section { text-align: center; margin-bottom: 50px; }
        .amount { font-size: 56px; font-weight: 500; color: #000; letter-spacing: -1.5px; }
        .currency { font-size: 22px; font-weight: 400; color: #000; }
        
        .divider { height: 1px; background-color: var(--divider-color); margin-bottom: 30px; }
        
        .details-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 16px; }
        .detail-label { color: #999999; flex: 1; font-weight: 400; }
        .detail-value { color: #000000; text-align: right; flex: 1; font-weight: 500; word-break: break-word; }
        
        .qr-section { display: flex; justify-content: flex-end; align-items: center; gap: 8px; color: var(--primary-green); font-size: 16px; margin-bottom: 30px; }
        .qr-section svg { width: 24px; height: 24px; fill: none; stroke: var(--primary-green); stroke-width: 2; }
        
        /* Ad Banner Styles */
        .ad-banner-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: auto;
            margin-bottom: 20px;
            background-color: #1a432a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 110px;
        }
        
        .custom-ad-img {
            width: 100%;
            height: auto;
            display: none; /* Hidden by default */
            object-fit: cover;
        }

        /* Default CSS Mockup of the Zemen Ad */
        #default-ad {
            width: 100%;
            height: 110px;
            background: linear-gradient(135deg, #1a432a 0%, #12301e 100%);
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 20px;
        }
        .ad-text-content { display: flex; flex-direction: column; z-index: 2; }
        .ad-amharic { font-size: 26px; font-weight: 700; color: white; line-height: 1; margin-bottom: 2px; font-family: sans-serif; }
        .ad-zemen { font-size: 24px; font-weight: 700; color: white; line-height: 1.1; }
        .ad-zemen span { color: #e7b749; }
        .ad-subtext { font-size: 10px; color: #a3c4b2; font-style: italic; margin-top: 2px; }
        
        .ad-phone-mock {
            position: absolute;
            right: 20px;
            bottom: -10px;
            width: 65px;
            height: 120px;
            background-color: #222;
            border: 2px solid #888;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: center;
            padding-top: 12px;
            transform: rotate(-5deg);
        }
        .ad-phone-mock::before {
            content: '';
            position: absolute;
            top: 4px;
            width: 20px;
            height: 3px;
            background: #888;
            border-radius: 2px;
        }
        .ad-phone-screen {
            width: 52px;
            height: 85px;
            background: linear-gradient(to bottom, #d1e8d5, #5c8f68);
            border-radius: 3px;
        }
        
        /* Buttons */
        .button-container { padding: 20px 20px 40px 20px; background-color: white; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #eee; }
        .finished-btn, .edit-btn { width: 100%; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 500; cursor: pointer; border: none; -webkit-appearance: none; }
        .finished-btn { background-color: var(--primary-green); color: white; }
        .edit-btn { background-color: #f0f0f0; color: var(--text-dark); }
    </style>
</head>
<body>

<div class="phone-screen">
    
    <!-- FORM SCREEN -->
    <div id="form-screen">
        <div class="form-header">
            <h1>Transfer Details</h1>
            <p>Enter details to generate receipt</p>
        </div>
        <div>
            <div class="form-group">
                <label>Transaction To (Name)</label>
                <input type="text" id="inputName" placeholder="e.g. Ebrahim">
            </div>
            <div class="form-group">
                <label>Amount (ETB)</label>
                <input type="number" id="inputAmount" placeholder="e.g. 127.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Transaction Time</label>
                <input type="text" id="inputTime" value="2026/10/23 09:07:14">
            </div>
            <div class="form-group">
                <label>Transaction Number</label>
                <input type="text" id="inputTxNum" value="DJN979W2VX">
            </div>
            <div class="form-group">
                <label>Custom Ad Image URL (Optional)</label>
                <input type="url" id="inputAdUrl" placeholder="https://example.com/ad.jpg">
            </div>
            <button type="button" class="submit-btn" id="generateBtn">Generate Receipt</button>
        </div>
    </div>

    <!-- RECEIPT SCREEN -->
    <div id="receipt-screen">
        <!-- CAPTURE AREA -->
        <div id="capture-area" style="background-color: white; display: flex; flex-direction: column; flex: 1;">
            
            <!-- Clean White Top (No OS Status Bar) -->
            <div class="action-bar">
                <div class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Download
                </div>
                <div class="action-btn">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    Share
                </div>
            </div>

            <div class="main-content">
                <div class="success-header">
                    <div class="check-circle">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="success-title">Successful</div>
                </div>
                
                <div class="amount-section">
                    <span class="amount" id="displayAmount">−0.00</span> <span class="currency">(ETB)</span>
                </div>
                
                <div class="divider"></div>
                
                <div class="details-list">
                    <div class="detail-row">
                        <span class="detail-label">Transaction Time:</span>
                        <span class="detail-value" id="displayTime"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction Type:</span>
                        <span class="detail-value">Transfer Money</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction To:</span>
                        <span class="detail-value" id="displayName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction Number:</span>
                        <span class="detail-value" id="displayTxNum"></span>
                    </div>
                </div>
                
                <div class="qr-section">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 21h7v-3h-7v3zM21 10h-3v4h3v-4zM10 14H3v7h7v-7z"/></svg>
                    QR Code
                </div>
                
                <div class="ad-banner-container">
                    <!-- Default CSS Ad -->
                    <div id="default-ad">
                        <div class="ad-text-content">
                            <div class="ad-amharic">ሐገር</div>
                            <div class="ad-zemen">Zemen<span>GEBEYA</span></div>
                            <div class="ad-subtext">Where Ethiopia Shops Digitally</div>
                        </div>
                        <div class="ad-phone-mock">
                            <div class="ad-phone-screen"></div>
                        </div>
                    </div>
                    <!-- Custom Image Ad (Hidden by default) -->
                    <img id="custom-ad-img" class="custom-ad-img" src="" alt="Custom Ad">
                </div>
            </div>
        </div> <!-- End Capture Area -->

        <div class="button-container">
            <button class="finished-btn" id="downloadBtn">Save Image to Phone</button>
            <button class="edit-btn" id="backBtn">Edit Details</button>
        </div>
    </div>

</div>

<script>
    // Initialize Telegram Web App
    let tg = window.Telegram.WebApp;
    tg.expand(); 

    document.addEventListener("DOMContentLoaded", function() {
        const formScreen = document.getElementById('form-screen');
        const receiptScreen = document.getElementById('receipt-screen');
        const generateBtn = document.getElementById('generateBtn');
        const backBtn = document.getElementById('backBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        // Back Button Fix
        backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            receiptScreen.style.display = 'none';
            formScreen.style.display = 'flex';
            window.scrollTo(0, 0); 
        });

        // Generate Button Logic
        generateBtn.addEventListener('click', function() {
            const nameVal = document.getElementById('inputName').value.trim();
            const amountVal = document.getElementById('inputAmount').value;
            const timeVal = document.getElementById('inputTime').value.trim();
            const txNumVal = document.getElementById('inputTxNum').value.trim();
            const adUrlVal = document.getElementById('inputAdUrl').value.trim();

            if (!nameVal || !amountVal || !timeVal || !txNumVal) {
                if (tg.showAlert) { tg.showAlert("Please fill in all required fields."); } 
                else { alert("Please fill in all required fields."); }
                return;
            }

            // Populate Text
            document.getElementById('displayName').textContent = nameVal;
            document.getElementById('displayAmount').textContent = `−${parseFloat(amountVal).toFixed(2)}`;
            document.getElementById('displayTime').textContent = timeVal;
            document.getElementById('displayTxNum').textContent = txNumVal;

            // Handle Custom Ad
            const customAdImg = document.getElementById('custom-ad-img');
            const defaultAd = document.getElementById('default-ad');

            if (adUrlVal) {
                customAdImg.src = adUrlVal;
                customAdImg.style.display = 'block';
                defaultAd.style.display = 'none';
            } else {
                customAdImg.style.display = 'none';
                defaultAd.style.display = 'flex';
            }

            // Switch Screens
            formScreen.style.display = 'none';
            receiptScreen.style.display = 'flex';
            window.scrollTo(0, 0); 
        });

        // Download JPG Logic
        downloadBtn.addEventListener('click', function() {
            const captureArea = document.getElementById('capture-area');
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = "Saving...";
            downloadBtn.disabled = true;

            html2canvas(captureArea, {
                scale: 2, 
                useCORS: true, 
                backgroundColor: "#ffffff" 
            }).then(canvas => {
                // Convert to JPG
                const image = canvas.toDataURL("image/jpeg", 0.95);
                const link = document.createElement('a');
                link.href = image;
                link.download = `Receipt_${Date.now()}.jpg`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("Error: ", err);
                if (tg.showAlert) { tg.showAlert("Failed to save. Try long-pressing the screen."); }
                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            });
        });
    });
</script>
</body>
</html>
