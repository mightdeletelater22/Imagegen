<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imagegen</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- html2canvas for generating the image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #92c13e;
            --text-dark: #111111;
            --text-gray: #8c8c8c;
            --divider-color: #e8e8e8;
            --bg-color: #ffffff;
            --font-main: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-main);
            background-color: #e0e0e0; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .phone-screen {
            width: 100%;
            max-width: 414px; /* iPhone standard width */
            background-color: var(--bg-color);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Form Styles */
        #form-screen { padding: 24px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; min-height: 100dvh; }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h1 { font-size: 24px; color: var(--text-dark); margin-bottom: 8px; }
        .form-header p { color: var(--text-gray); font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-dark); margin-bottom: 6px; font-weight: 500; }
        
        .form-group input[type="text"], 
        .form-group input[type="number"] { 
            width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 10px; 
            font-size: 15px; font-family: var(--font-main); outline: none; -webkit-appearance: none; 
        }
        .form-group input[type="text"]:focus, 
        .form-group input[type="number"]:focus { border-color: var(--primary-green); }
        
        /* File Upload */
        .file-upload-wrapper {
            width: 100%; padding: 12px 14px; border: 1px dashed #ccc; border-radius: 10px;
            background-color: #fafafa; text-align: center; cursor: pointer; position: relative;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .file-upload-text { font-size: 14px; color: var(--text-gray); font-weight: 500; }
        .file-upload-wrapper.has-file { border-color: var(--primary-green); background-color: #f4f9eb; }
        .file-upload-wrapper.has-file .file-upload-text { color: var(--primary-green); }

        .submit-btn { width: 100%; padding: 14px; background-color: var(--primary-green); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; -webkit-appearance: none; }
        
        /* Receipt Styles */
        #receipt-screen { display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh; background-color: var(--bg-color); }
        
        /* iOS Status Bar */
        .ios-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px 20px;
            background-color: white;
            font-size: 15px;
            font-weight: 600;
            color: #000;
            letter-spacing: -0.3px;
        }
        .status-left, .status-right { display: flex; align-items: center; gap: 6px; }
        .status-left svg { width: 18px; height: 12px; fill: #000; }
        .status-center { font-weight: 600; }
        .status-right svg { width: 16px; height: 16px; fill: #000; }
        .status-right .battery-icon { width: 24px; height: 12px; }

        /* Action Bar */
        .action-bar { display: flex; justify-content: space-between; padding: 16px 20px; color: var(--primary-green); font-size: 16px; font-weight: 400; background-color: white; }
        .action-btn { display: flex; align-items: center; gap: 6px; }
        .action-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--primary-green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; padding-top: 10px; }
        
        /* Header section */
        .success-header { display: flex; flex-direction: column; align-items: center; margin-top: 10px; margin-bottom: 30px; }
        .check-circle { width: 75px; height: 75px; background-color: var(--primary-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 14px; }
        .check-circle svg { width: 35px; height: 35px; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .success-title { color: var(--primary-green); font-size: 20px; font-weight: 400; letter-spacing: 0.2px; }
        
        /* Amount */
        .amount-section { text-align: center; margin-bottom: 40px; }
        .amount { font-size: 44px; font-weight: 500; color: #000; letter-spacing: -1px; }
        .currency { font-size: 18px; font-weight: 400; color: #333; margin-left: 2px; }
        
        /* Details */
        .divider { height: 1px; background-color: var(--divider-color); margin-bottom: 20px; }
        .details-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 15px; }
        .detail-label { color: #999999; flex: 1; font-weight: 400; }
        .detail-value { color: #000000; text-align: right; flex: 1; font-weight: 500; word-break: break-word; }
        
        /* QR Code */
        .qr-section { display: flex; justify-content: flex-end; align-items: center; gap: 6px; color: var(--primary-green); font-size: 15px; margin-bottom: 24px; }
        .qr-section svg { width: 20px; height: 20px; fill: none; stroke: var(--primary-green); stroke-width: 2; }
        
        /* Ad Banner */
        .ad-banner-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-top: auto;
            margin-bottom: 20px;
            background-color: #1a432a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 90px;
        }
        
        .custom-ad-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Default Ad CSS Mockup */
        #default-ad {
            width: 100%;
            height: 100%;
            background: #123620; /* Deep green */
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 16px;
        }
        
        /* Faint grid lines to simulate the network graphic */
        #default-ad::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .ad-text-content { display: flex; flex-direction: column; z-index: 2; }
        .ad-amharic { font-size: 20px; font-weight: 700; color: white; line-height: 1; margin-bottom: 2px; font-family: sans-serif; }
        .ad-zemen { font-size: 22px; font-weight: 700; color: white; line-height: 1.1; letter-spacing: -0.5px;}
        .ad-zemen span { color: #e7b749; }
        .ad-subtext { font-size: 9px; color: #a3c4b2; font-style: italic; margin-top: 2px; }
        
        .ad-phone-mock {
            position: absolute;
            right: 15px;
            bottom: -15px;
            width: 55px;
            height: 100px;
            background-color: #222;
            border: 3px solid #555;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: center;
            padding-top: 10px;
            transform: rotate(-3deg);
            z-index: 2;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }
        .ad-phone-mock::before {
            content: '';
            position: absolute;
            top: 3px;
            width: 15px;
            height: 2px;
            background: #555;
            border-radius: 2px;
        }
        .ad-phone-screen {
            width: 45px;
            height: 80px;
            background: linear-gradient(to bottom, #d1e8d5, #5c8f68);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5px;
        }
        .ad-phone-screen-text {
            color: #fff;
            font-size: 6px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }
        
        /* Buttons */
        .button-container { padding: 20px; background-color: white; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #f0f0f0; }
        .finished-btn, .edit-btn { width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; border: none; -webkit-appearance: none; }
        .finished-btn { background-color: var(--primary-green); color: white; }
        .edit-btn { background-color: #f5f5f5; color: var(--text-dark); }
    </style>
</head>
<body>

<div class="phone-screen">
    
    <!-- FORM SCREEN -->
    <div id="form-screen">
        <div class="form-header">
            <h1>Imagegen</h1>
            <p>Enter details to generate image</p>
        </div>
        <div>
            <div class="form-group">
                <label>Transaction To (Name)</label>
                <input type="text" id="inputName" placeholder="e.g. Ebrahim">
            </div>
            <div class="form-group">
                <label>Amount (ETB)</label>
                <input type="number" id="inputAmount" placeholder="e.g. 127.00" step="0.01">
            </div>
            <div class="form-group">
                <label>Transaction Time</label>
                <input type="text" id="inputTime" value="2026/10/23 09:07:14">
            </div>
            <div class="form-group">
                <label>Transaction Number</label>
                <input type="text" id="inputTxNum" value="DJN979W2VX">
            </div>
            
            <div class="form-group">
                <label>Custom Ad Image (Optional)</label>
                <div class="file-upload-wrapper" id="fileUploadWrapper">
                    <input type="file" id="inputAdFile" accept="image/*">
                    <div class="file-upload-text" id="fileUploadText">Tap to upload image</div>
                </div>
            </div>
            
            <button type="button" class="submit-btn" id="generateBtn">Generate Image</button>
        </div>
    </div>

    <!-- RECEIPT SCREEN -->
    <div id="receipt-screen">
        <!-- CAPTURE AREA -->
        <div id="capture-area" style="background-color: white; display: flex; flex-direction: column; flex: 1;">
            
            <!-- iOS Status Bar -->
            <div class="ios-status-bar">
                <div class="status-left">
                    <!-- Signal Icon -->
                    <svg viewBox="0 0 16 12"><path d="M1 11h2V8H1v3zm3 0h2V6H4v5zm3 0h2V3H7v8zm3 0h2V1h-2v10zm3 0h2V0h-2v11z"/></svg>
                    <span>Ethio telecom</span>
                    <span style="font-weight: 500; margin-left: 2px;">LTE</span>
                </div>
                <div class="status-center">9:07 am</div>
                <div class="status-right">
                    <!-- Location Icon -->
                    <svg viewBox="0 0 24 24"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
                    <!-- Eye Icon (Screen Time/Location) -->
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    <span>73%</span>
                    <!-- Battery Icon -->
                    <svg class="battery-icon" viewBox="0 0 24 12"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="#000" stroke-width="1.5"/><rect x="3" y="3" width="14" height="6" rx="1.5" fill="#000"/><path d="M22 4v4h1.5V4H22z" fill="#000"/></svg>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar">
                <div class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Download
                </div>
                <div class="action-btn">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    Share
                </div>
            </div>

            <div class="main-content">
                <div class="success-header">
                    <div class="check-circle">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="success-title">Successful</div>
                </div>
                
                <div class="amount-section">
                    <span class="amount" id="displayAmount">−0.00</span> <span class="currency">(ETB)</span>
                </div>
                
                <div class="divider"></div>
                
                <div class="details-list">
                    <div class="detail-row">
                        <span class="detail-label">Transaction Time:</span>
                        <span class="detail-value" id="displayTime"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction Type:</span>
                        <span class="detail-value">Transfer Money</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction To:</span>
                        <span class="detail-value" id="displayName"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Transaction Number:</span>
                        <span class="detail-value" id="displayTxNum"></span>
                    </div>
                </div>
                
                <div class="qr-section">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 21h7v-3h-7v3zM21 10h-3v4h3v-4zM10 14H3v7h7v-7z"/></svg>
                    QR Code
                </div>
                
                <div class="ad-banner-container">
                    <!-- Default CSS Ad -->
                    <div id="default-ad">
                        <div class="ad-text-content">
                            <div class="ad-amharic">ሐገር</div>
                            <div class="ad-zemen">Zemen<span>GEBEYA</span></div>
                            <div class="ad-subtext">Where Ethiopia Shops Digitally</div>
                        </div>
                        <div class="ad-phone-mock">
                            <div class="ad-phone-screen">
                                <div class="ad-phone-screen-text">ሐገር<br>ZemenGEBEYA</div>
                            </div>
                        </div>
                    </div>
                    <!-- Custom Image Ad -->
                    <img id="custom-ad-img" class="custom-ad-img" src="" alt="Custom Ad">
                </div>
            </div>
        </div> <!-- End Capture Area -->

        <div class="button-container">
            <button class="finished-btn" id="downloadBtn">Download Image</button>
            <button class="edit-btn" id="backBtn">Edit Details</button>
        </div>
    </div>

</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); 

    document.addEventListener("DOMContentLoaded", function() {
        const formScreen = document.getElementById('form-screen');
        const receiptScreen = document.getElementById('receipt-screen');
        const generateBtn = document.getElementById('generateBtn');
        const backBtn = document.getElementById('backBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const inputAdFile = document.getElementById('inputAdFile');
        const fileUploadWrapper = document.getElementById('fileUploadWrapper');
        const fileUploadText = document.getElementById('fileUploadText');
        let uploadedAdDataUrl = null;

        inputAdFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedAdDataUrl = event.target.result;
                    fileUploadWrapper.classList.add('has-file');
                    fileUploadText.textContent = "✓ Image Selected: " + file.name;
                };
                reader.readAsDataURL(file);
            } else {
                uploadedAdDataUrl = null;
                fileUploadWrapper.classList.remove('has-file');
                fileUploadText.textContent = "Tap to upload image";
            }
        });

        backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            receiptScreen.style.display = 'none';
            formScreen.style.display = 'flex';
            window.scrollTo(0, 0); 
        });

        generateBtn.addEventListener('click', function() {
            const nameVal = document.getElementById('inputName').value.trim();
            const amountVal = document.getElementById('inputAmount').value;
            const timeVal = document.getElementById('inputTime').value.trim();
            const txNumVal = document.getElementById('inputTxNum').value.trim();

            if (!nameVal || !amountVal || !timeVal || !txNumVal) {
                if (tg.showAlert) { tg.showAlert("Please fill in all required fields."); } 
                else { alert("Please fill in all required fields."); }
                return;
            }

            document.getElementById('displayName').textContent = nameVal;
            document.getElementById('displayAmount').textContent = `−${parseFloat(amountVal).toFixed(2)}`;
            document.getElementById('displayTime').textContent = timeVal;
            document.getElementById('displayTxNum').textContent = txNumVal;

            const customAdImg = document.getElementById('custom-ad-img');
            const defaultAd = document.getElementById('default-ad');

            if (uploadedAdDataUrl) {
                customAdImg.src = uploadedAdDataUrl;
                customAdImg.style.display = 'block';
                defaultAd.style.display = 'none';
            } else {
                customAdImg.style.display = 'none';
                defaultAd.style.display = 'flex';
            }

            formScreen.style.display = 'none';
            receiptScreen.style.display = 'flex';
            window.scrollTo(0, 0); 
        });

        downloadBtn.addEventListener('click', function() {
            const captureArea = document.getElementById('capture-area');
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = "Saving...";
            downloadBtn.disabled = true;

            html2canvas(captureArea, {
                scale: 2, 
                useCORS: true, 
                backgroundColor: "#ffffff" 
            }).then(canvas => {
                const image = canvas.toDataURL("image/jpeg", 0.95);
                const link = document.createElement('a');
                link.href = image;
                link.download = `Imagegen_${Date.now()}.jpg`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("Error: ", err);
                if (tg.showAlert) { tg.showAlert("Failed to save. Try long-pressing the screen."); }
                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            });
        });
    });
</script>
</body>
</html>
